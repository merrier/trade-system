name: Ingest Mootdx main daily bars

on:
  schedule:
    # 17:05 Asia/Shanghai on weekdays, after Iwencai universe refresh.
    - cron: "5 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mootdx-main-daily-bars-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:../data/trade-system.db"
      PYTHON_BIN: "python3"
      MOOTDX_TIMEOUT_MS: "1800000"

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive --no-lockfile

      - name: Install Python data dependencies
        run: python3 -m pip install --user mootdx pandas

      - name: Select Mootdx best server
        run: python3 -m mootdx bestip

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Initialize SQLite schema
        run: yarn db:init

      - name: Ingest Mootdx main daily bars
        run: yarn ingest:mootdx-main-daily-bars -- --days=30 --concurrency=8

      - name: Upload Mootdx daily bar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mootdx-main-daily-bars
          path: |
            data/mootdx/main-daily-bars-*.json
            cache/main-daily-bars.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit Mootdx daily bars to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/mootdx/main-daily-bars-*.json cache/main-daily-bars.json
          if git diff --cached --quiet; then
            echo "No Mootdx daily bar changes to commit."
          else
            git commit -m "data: update mootdx main daily bars $(date -u +%Y-%m-%d)"
            git push origin HEAD:dev
          fi
