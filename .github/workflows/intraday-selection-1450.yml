name: Send 14:50 intraday selection

on:
  workflow_dispatch:
    inputs:
      skip_delivery:
        description: "Skip message delivery for manual test runs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: intraday-selection-1450
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:../data/trade-system.db"
      PYTHON_BIN: "python3"
      PREVIOUS_STATIC_DATA_DIR: "."
      SKIP_DAILY_BAR_REFRESH: "true"
      DATA_PROVIDER_TIMEOUT_MS: "60000"
      IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}
      IWENCAI_API_KEY_FALLBACK: ${{ secrets.IWENCAI_API_KEY_FALLBACK }}
      IWENCAI_BASE_URL: "https://openapi.iwencai.com"
      IWENCAI_SKILL_CLI: "~/.codex/skills/hithink-market-query/scripts/cli.py"
      IWENCAI_TIMEOUT_MS: "30000"
      IWENCAI_CONTEXT_TOP_N: "10"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      HERMES_ANALYSIS_COMMAND: "./scripts/hermes-analysis.sh"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_WEBHOOK_MODE: ${{ vars.FEISHU_WEBHOOK_MODE }}
      FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD }}
      INTRADAY_STRATEGY_PROMPT: "涨停回踩阴线策略：主板股票近5日出现实体涨停，涨停后有阴线调整，调整区间最低价未跌破涨停当日开盘价，今日收阴线但收盘价不跌破10日均线，今日涨幅小于5%，近20日最大涨幅小于45%，非ST，非科创板，非北交所，非创业板，股价大于5元，近5日日均成交额大于3000万"

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive --no-lockfile

      - name: Install Python data dependencies
        run: python3 -m pip install --user akshare pandas efinance baostock easyquotation

      - name: Install Iwencai SkillHub CLI
        run: |
          curl -fsSL -o /tmp/iwencai-skillhub-cli.zip https://www.iwencai.com/skillhub/static/0.0.4/iwencai-skillhub-cli.zip
          rm -rf /tmp/iwencai-skillhub-cli
          mkdir -p /tmp/iwencai-skillhub-cli
          unzip -q -o /tmp/iwencai-skillhub-cli.zip -d /tmp/iwencai-skillhub-cli
          bash /tmp/iwencai-skillhub-cli/iwencai-skillhub-cli/iwencai-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hithink market query skill
        run: iwencai-skillhub-cli --dir "$HOME/.codex/skills" install hithink-market-query

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Initialize SQLite schema
        run: yarn db:init

      - name: Build and send 14:50 intraday selection
        run: |
          extra_args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_delivery }}" != "false" ]; then
            extra_args="--skip-delivery"
          fi
          yarn reports:run -- --kind=intraday-selection --skip-daily-bar-refresh ${extra_args}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraday-selection-1450
          path: dist-web/data/reports/intraday-selection/*.json
          if-no-files-found: warn
          retention-days: 30
